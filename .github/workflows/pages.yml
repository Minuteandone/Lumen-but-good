name: Render and deploy LUMEN

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lumen-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install renderer dependencies
        run: pip install -r requirements.txt

      - name: Restore rendered chunk cache
        uses: actions/cache@v4
        with:
          path: |
            media/chunks
            media/ep01.wav
          key: lumen-ep01-${{ runner.os }}-${{ hashFiles('engine/**', 'episodes/**', 'tools/render_full.py', 'requirements.txt') }}

      - name: Render Episode 1
        env:
          LUMEN_PRESET: veryfast
        run: |
          mkdir -p site/media
          python tools/render_full.py --fps 24 --chunk-seconds 15 --missing --assemble --output site/media/ep01_first_light.mp4

      - name: Render poster
        run: |
          python - <<'PY'
          from episodes.ep01_first_light import frame_at
          frame_at(349).save("site/poster.png")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
